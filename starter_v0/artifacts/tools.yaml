# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: { type: string, default: "", description: "Câu hỏi" }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "Kiểu trả lời",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Các lựa chọn",
          }
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: { type: string, default: "", description: "Tên tài khoản" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        search_type:
          {
            type: string,
            enum: [Latest, Top],
            default: "Latest",
            description: "Cách sắp xếp",
          }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        topic:
          {
            type: string,
            enum: [general, news],
            default: "general",
            description: "Phân loại",
          }
        timeframe:
          {
            type: string,
            enum: [day, week, month, year],
            default: "week",
            description: "Khoảng thời gian",
          }
        max_results: { type: integer, default: 5, description: "Số kết quả" }
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: { type: string, default: "", description: "Địa chỉ" }
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template:
          {
            type: string,
            enum: [brief, sections, bullets, thread, daily_ai_vn],
            default: "sections",
            description: "Khuôn",
          }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                ai_research,
                source_citation,
                data_privacy,
                external_publishing,
                tool_usage,
              ],
            default: "all",
            description: "Nhóm",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by:
          {
            type: string,
            enum: [relevance, lastUpdatedDate, submittedDate],
            default: "relevance",
            description: "Sắp xếp",
          }
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]

  - name: dedupe_sources
    description: >-
      Loại bỏ nguồn trùng từ danh sách bài báo/kết quả đã thu thập; ưu tiên URL
      chuẩn hóa (bỏ UTM/fragment), không có URL thì dùng tiêu đề.
      Dùng sau lookup/social_search/timeline để xóa trùng.
      KHÔNG dùng để tìm kiếm thông tin mới hoặc xác minh nguồn.
    parameters:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
          description: "Danh sách nguồn có title/url/summary (có thể thiếu một số field)."
        keep:
          type: string
          enum: [first, last]
          default: first
          description: "Giữ bản đầu tiên hay cuối cùng của các nguồn trùng."
      required: [items]

  - name: date_filter
    description: >-
      Lọc danh sách bài báo đã có theo ngày phát hành, bao gồm ngày bắt đầu
      và kết thúc. Hữu ích cho lọc nghiên cứu theo giai đoạn.
      KHÔNG dùng thay lookup để tìm nguồn mới. Chỉ có thể lọc item có date,
      published_date, published, created_at hoặc published_at ở dạng ISO/RFC.
    parameters:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
          description: "Các item đã tìm kiếm, có trường date/published/published_at/published_date/created_at."
        start_date:
          type: string
          description: "Ngày bắt đầu YYYY-MM-DD; để trống nếu không giới hạn."
        end_date:
          type: string
          description: "Ngày kết thúc YYYY-MM-DD; để trống nếu không giới hạn."
        include_undated:
          type: boolean
          default: false
          description: "Có giữ item thiếu ngày phát hành không."
      required: [items]

  - name: source_audit
    description: >-
      Kiểm tra CHỈ chất lượng cấu trúc danh sách nguồn: title, URL hợp lệ,
      summary, URL trùng, và HTTPS. KHÔNG xác minh độ đúng của tin,
      độ uy tín tác giả hay bảo mật website. Dùng trước khi làm báo cáo.
    parameters:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
          description: "Danh sách các nguồn cần kiểm tra cấu trúc."
        require_https:
          type: boolean
          default: false
          description: "Có báo lỗi URL dùng HTTP thay vì HTTPS không."
      required: [items]

  - name: keyword_extract
    description: >-
      Trích các từ khóa xuất hiện nhiều trong văn bản đã cung cấp bằng tần suất
      đơn giản, không dùng AI hay Internet. Dùng khi user muốn liệt kê từ khóa
      của văn bản. KHÔNG dùng cho tìm web hay phân tích ý nghĩa chuyên sâu.
    parameters:
      type: object
      properties:
        text:
          type: string
          description: "Văn bản để trích từ khóa."
        max_keywords:
          type: integer
          default: 8
          minimum: 1
          maximum: 20
          description: "Số lượng từ khóa tối đa (1..20)."
      required: [text]
